<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naruto Shippuden - El Camino Ninja</title>
    <style>
        body {
            background-color: #1a1a1a; /* Fondo oscuro */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px;
        }
        .contenedor {
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ff6600; /* Borde naranja característico de Naruto */
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0px 0px 20px rgba(255, 102, 0, 0.3);
        }
        h1 {
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        /* Estilo para la imagen de Naruto */
        .imagen-naruto {
            margin: 20px 0;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        /* Estilo para el hipervínculo */
        .enlace-crunchyroll {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff6600;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .enlace-crunchyroll:hover {
            background-color: #cc5200; /* Naranja más oscuro al pasar el cursor */
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>¡Bienvenido a la Aldea Oculta de la Hoja!</h1>
        <p>Acompaña a Naruto Uzumaki en su camino para convertirse en Hokage y proteger a sus seres queridos de Akatsuki.</p>
        
        <!-- Código para insertar tu imagen GIF -->
        <img src="naruto-uzumaki-smiling-doodle.gif" alt="Naruto Uzumaki Sonriendo" class="imagen-naruto">
        
        <p>¿Quieres saber más sobre la cronología y los episodios de la serie?</p>

        <!-- Código para insertar el hipervínculo de Crunchyroll -->
        <a href="https://www.crunchyroll.com/es/news/guides/2023/11/5/arcos-naruto-shippuden-boruto" target="_blank" class="enlace-crunchyroll">
            Ver la Guía de Arcos en Crunchyroll
        </a>
    </div>

</body>
</html>
