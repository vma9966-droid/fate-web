<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Victor Manuel San Martin Santes">
  <title>Fate | Acceso al Almacén</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tienda.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="nav-row">
      <div class="brand"><img src="img/icon-saber.svg" alt="">FATE SERIES</div>
      <nav class="menu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="personajes.html">Servants</a></li>
          <li><a href="multimedia.html">Multimedia</a></li>
          <li><a href="formulario.html">Contrato de Master</a></li>
          <li><a href="login.html" class="active" style="color: var(--gold); font-weight: 600;">Tienda / Carrito</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding:56px 0 24px;">
      <div class="container">
        <h1 id="form-title">Identificación de Master</h1>
        <p id="form-subtitle">Inicia sesión o regístrate para acceder a los suministros mágicos.</p>
      </div>
    </section>

    <section id="login-section">
      <div class="container">
        
        <!-- VISTA DE LOGIN -->
        <div id="login-container">
          <form class="contract" onsubmit="iniciarSesion(event)">
            <div class="field">

              <label for="username">Usuario (Nombre de Master)</label>
              <!-- Límite de 10 caracteres -->
              <input type="text" id="username" placeholder="Ingresa tu usuario" maxlength="10" required>
            </div>
            
            <div class="field" style="margin-bottom: 8px;">

              <label for="password">Contraseña (Sello de Comando)</label>
              <!-- Límite de 10 caracteres -->
              <input type="password" id="password" placeholder="••••••••" maxlength="10" required>
            </div>

            <!-- Checkbox Mostrar Contraseña -->
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
              <input type="checkbox" id="show-pass-login" onclick="togglePassword('password')" style="width: auto;">
              <label for="show-pass-login" style="margin: 0; font-size: 0.85rem; text-transform: none; color: var(--ink-muted);">Mostrar contraseña</label>
            </div>

            <div class="button-group" style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button type="submit" class="submit">Ingresar a la Tienda</button>
              <button type="button" class="submit" style="background: var(--line); color: var(--ink);" onclick="mostrarRegistro()">Registrarse</button>
            </div>
          </form>
        </div>

        <!-- VISTA DE REGISTRO  -->
        <div id="register-container" style="display: none;">
          <form class="contract" onsubmit="registrarUsuario(event)">
            <div class="field">

              <label for="reg-username">Nuevo Usuario</label>
              <!-- Límite de 10 caracteres agregado aquí -->
              <input type="text" id="reg-username" placeholder="Crea un nombre de usuario" maxlength="10" required>
            </div>
            
            <div class="field" style="margin-bottom: 8px;">
              
              <label for="reg-password">Nueva Contraseña</label>
              <!-- Límite de 10 caracteres agregado aquí -->
              <input type="password" id="reg-password" placeholder="Crea una contraseña" maxlength="10" required>
            </div>

            <!-- Checkbox Mostrar Contraseña -->
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
              <input type="checkbox" id="show-pass-reg" onclick="togglePassword('reg-password')" style="width: auto;">
              <label for="show-pass-reg" style="margin: 0; font-size: 0.85rem; text-transform: none; color: var(--ink-muted);">Mostrar contraseña</label>
            </div>

            <div class="button-group" style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button type="submit" class="submit">Guardar Registro</button>
              <button type="button" class="submit" style="background: var(--line); color: var(--ink);" onclick="mostrarLogin()">Volver al Login</button>
            </div>
          </form>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
