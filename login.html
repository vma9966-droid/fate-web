<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Victor Manuel San Martin Santes - 22480855">
  <title>Fate | Acceso al Almacén</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Conexión al script externo -->
  <script src="js/tienda.js" defer></script> 
</head>
<body>

  <header class="site-header">
    <div class="nav-row">
      <div class="brand"><img src="img/icon-saber.svg" alt="">FATE SERIES</div>
      <nav class="menu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="personajes.html">Servants</a></li>
          <li><a href="login.html" class="active">Tienda / Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="padding:56px 0 24px;">
      <div class="container">
        <h1>Identificación de Master</h1>
        <p>Inicia sesión o regístrate para acceder a los suministros mágicos.</p>
      </div>
    </section>

    <section id="login-section">
      <div class="container">
        <!-- Formulario que llama a la función iniciarSesion() del JS -->
        <form class="contract" onsubmit="iniciarSesion(event)">
          <div class="field">
            <label for="username">Usuario (Nombre de Master)</label>
            <input type="text" id="username" placeholder="Ingresa tu usuario" required>
          </div>
          
          <div class="field">
            <label for="password">Contraseña (Sello de Comando)</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="submit">Ingresar a la Tienda</button>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
